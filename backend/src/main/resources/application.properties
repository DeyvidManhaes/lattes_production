# ---- Banco de dados (sobrescreva por variaveis de ambiente) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_lattesproduction}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Aplicacao ----
server.port=${PORT:8080}
# Pasta com os curriculos Lattes em XML (relativa a pasta backend/ por padrao)
lattes.curriculos-dir=${LATTES_CURRICULOS_DIR:./curriculos_xml}
# Origens autorizadas a chamar a API (CORS), separadas por virgula
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
